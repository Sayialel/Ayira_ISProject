name: Embed new workers

# Gives newly signed-up workers their semantic vector.
#
# The deployed engine cannot do this. It runs on a 512 MB instance and sits at
# 129 MB with the model unloaded, but reaches 445 MB once the model is loaded
# and used -- so a request that tried to embed was killed by the host and the
# worker saw a 502. Serving therefore never loads the model: a worker without
# a vector still gets a ranking, from keywords and location, marked 'degraded'.
#
# This restores the full signal. A GitHub runner has several gigabytes, the
# job is not latency-sensitive, and it is free. Every half hour it embeds
# whoever has signed up or edited their profile since the last run; in the
# usual case there is nobody and it exits in seconds.
#
# Required repository secrets:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#
# To get the event-driven path as well, the gateway needs GITHUB_REPO and a
# GITHUB_DISPATCH_TOKEN with 'contents: write' on this repository. Those are
# environment variables on the gateway, not secrets here. Without them this
# workflow still runs on the schedule below.

on:
  # Fired by the gateway the moment a worker saves skills or a bio -- see
  # apps/api/src/lib/embedTrigger.ts. This is the path that matters: it means a
  # new worker's vector is computed about a minute after they fill in their
  # profile, rather than whenever the schedule next comes round.
  repository_dispatch:
    types: [worker-profile-changed]

  schedule:
    # The backstop, for a dispatch that never arrived: GitHub was down, the
    # token is unset or expired, or a row was changed outside the gateway.
    # Ten minutes rather than thirty because Actions is free on a public
    # repository and a run with nobody to embed exits in seconds.
    - cron: '*/10 * * * *'

  workflow_dispatch:

# Two runs writing the same rows would only duplicate work. Not cancelled in
# progress: the job is idempotent but a half-finished run leaves some workers
# embedded and some not, and killing it to start again just moves the boundary.
# A dispatch that arrives during a run queues behind it and re-reads the table,
# so nothing is lost.
concurrency:
  group: embed-new-workers
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    # The model download plus embedding; generous, because being killed
    # half-way leaves some workers done and some not.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the engine and CI. A different interpreter can move a
          # float, and these vectors are compared against ones computed here.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai-engine/requirements.txt

      - name: Install
        working-directory: apps/ai-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check which workers need a vector
        working-directory: apps/ai-engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m eval.backfill_worker_embeddings --dry-run

      - name: Embed them
        working-directory: apps/ai-engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m eval.backfill_worker_embeddings
