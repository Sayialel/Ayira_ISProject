name: Keep warm

# Render's free instances spin down after about 15 minutes idle. Waking the
# matching engine is not quick: it is a cold container plus loading the
# sentence-transformer, and a request that arrives during it gets a 502. That
# is the most likely way a live demonstration goes wrong.
#
# This pings both services so they stay up during the hours anyone is likely
# to use them.
#
# Why not every 10 minutes around the clock: Render's free plan includes 750
# instance-hours per month per workspace, and two services kept alive
# continuously would need about 1,460.
#
# The window was 06:00-19:00 UTC and that was too late -- a match attempted
# at 05:48 UTC hit a fully cold engine, which took 93 seconds to answer a
# health check. It now starts at 03:00 UTC (06:00 in Nairobi) and runs every
# day, because work does not stop on Saturday. That is about 16 hours a day,
# roughly 490 instance-hours per service per month: still inside the
# allowance, with less of the day exposed.
#
# Before a demonstration outside those hours, run it by hand:
#   Actions -> Keep warm -> Run workflow

on:
  schedule:
    # Every 10 minutes, 03:00-19:00 UTC daily -- 06:00 to 22:00 in Nairobi.
    - cron: '*/10 3-19 * * *'
  workflow_dispatch:

# A queued run is pointless once a later one exists: both do the same thing.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the matching engine
        # The engine is the slow one, so it goes first and is given the long
        # timeout. --max-time, not --connect-timeout: the connection is
        # accepted immediately by Render's router while the container behind
        # it is still starting.
        run: |
          echo "Engine…"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 \
            https://ayira-engine.onrender.com/health || echo 000)
          echo "  /health -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Engine did not answer 200 within 180s (got $code)"
          fi

      - name: Wake the API gateway
        run: |
          echo "Gateway…"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 \
            https://ayira-api-t8wf.onrender.com/health || echo 000)
          echo "  /health -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Gateway did not answer 200 within 120s (got $code)"
          fi

      # Pages is static and never sleeps; this only catches a broken deploy.
      - name: Check the site is served
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            https://ayiraventures.pages.dev/ || echo 000)
          echo "  site -> $code"
          test "$code" = "200"
