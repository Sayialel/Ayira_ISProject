version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    env_file: .env
    depends_on:
      - ai-engine
    volumes:
      - ./apps/api/src:/app/src

  ai-engine:
    build:
      context: .
      dockerfile: apps/ai-engine/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - ./apps/ai-engine/app:/app/app

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    env_file: .env
    volumes:
      - ./apps/web/src:/app/src
