[pytest]
testpaths = tests
# The engine is imported as `app.*` and `eval.*`, which requires the package
# root on sys.path. tests/conftest.py adds it, and this keeps `pytest` working
# from the repository root as well as from apps/ai-engine.
pythonpath = .
filterwarnings =
    # Our own code must not warn; third-party deprecations are noise we do not
    # control and would otherwise bury a real warning.
    error::DeprecationWarning:app.*
    error::DeprecationWarning:eval.*
    ignore::DeprecationWarning
    ignore::UserWarning:matplotlib.*
    ignore::PendingDeprecationWarning
