# Serving the built single-page application.
#
# Port 8080 rather than 80, so the container needs no privileged port and can
# run as a non-root user on hosts that require one.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames change whenever their contents do, so they can be
  # cached indefinitely. index.html must not be, or a returning visitor keeps
  # loading the previous release's asset names after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Client-side routing. A refresh on /app/matches/history is a real request
  # for a path no file matches, and without this fallback nginx answers 404 on
  # every route except the root.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The gateway sets its own CORS and auth; these cover the static document.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
